[project]
name = "sentiment-analysis-platform"
version = "1.0.0"
description = "中文情感分析平台：字符 n-gram 可解释基线 + LoRA 微调管线（Apple Silicon / MPS）"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

# Track B（LoRA / MPS）依赖是**可选**的：
# 推理服务与 CI 测试完全不需要 torch，这样 CI 才能在几十秒内跑完。
# 本地跑 Track B：pip install -r requirements-mps.txt
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
mps = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
]

[project.scripts]
sentiment-api = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"